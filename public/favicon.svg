<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="55%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <radialGradient id="highlight" cx="0.25" cy="0.2" r="0.7">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.6"/>
    </filter>
  </defs>

  <!-- Rounded square background with gradient + glossy highlight -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <rect width="64" height="64" rx="14" fill="url(#highlight)"/>

  <!-- Session-tracking trail: small dot → medium dot → bright spark -->
  <path d="M14 42 Q24 36 32 32 T52 18"
        stroke="#ffffff" stroke-width="1.6" stroke-opacity="0.55"
        fill="none" stroke-linecap="round" stroke-dasharray="0.5 3"/>

  <circle cx="14" cy="42" r="3" fill="#ffffff" fill-opacity="0.55"/>
  <circle cx="24" cy="36" r="3.6" fill="#ffffff" fill-opacity="0.78"/>
  <circle cx="32" cy="32" r="3.8" fill="#ffffff"/>

  <!-- Sparkle at the leading edge -->
  <g transform="translate(50,20)" fill="#ffffff">
    <path d="M0 -12 C1.6 -4 4 -1.6 12 0 C4 1.6 1.6 4 0 12 C-1.6 4 -4 1.6 -12 0 C-4 -1.6 -1.6 -4 0 -12 Z"/>
    <circle cx="0" cy="0" r="1.8" fill="#6366f1"/>
  </g>

  <!-- Two tiny accent sparkles for depth -->
  <circle cx="42" cy="42" r="1.2" fill="#ffffff" fill-opacity="0.7"/>
  <circle cx="56" cy="38" r="0.9" fill="#ffffff" fill-opacity="0.6"/>
</svg>

name: Bug report
description: Something is broken or behaves unexpectedly.
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug! Before submitting, please make sure
        you've checked the open issues for an existing report.

  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what actually happened?
      placeholder: |
        I clicked rescan in the sidebar and ...
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: ai-coding-tracker version / commit
      description: From `package.json` or `git rev-parse --short HEAD`.
      placeholder: 0.1.0 or 7806726
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows
        - WSL
        - Other
    validations:
      required: true

  - type: input
    id: node
    attributes:
      label: Node.js version
      description: Output of `node --version`
      placeholder: v20.11.0
    validations:
      required: true

  - type: dropdown
    id: source
    attributes:
      label: Session source(s)
      description: Which AI CLI's sessions are you tracking?
      multiple: true
      options:
        - Claude Code (CLI)
        - Claude Desktop
        - Codex (CLI)
        - Other / unsure
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / error output
      description: Paste relevant logs from the browser console, terminal, or `/tmp/ai-coding-tracker.error.log`.
      render: shell
    validations:
      required: false

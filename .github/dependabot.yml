version: 2
updates:
  # npm dependencies (package.json / package-lock.json)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      # Patch / minor bumps get bundled into one PR per week.
      # Major bumps come as separate PRs so they can be reviewed individually.
      patch-and-minor:
        update-types:
          - patch
          - minor
    commit-message:
      prefix: deps
      include: scope

  # GitHub Actions workflow files
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Tokyo
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: ci
      include: scope
